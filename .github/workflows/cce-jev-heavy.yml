name: CCE Jev Heavy Tests

# 研究候选(experiments/jev 与蒸馏分析)的重测试层: 合成腿端到端 + 已提交结果从归档重算, 每个 8–90 分钟。
# ★ 2026-09-28: 它们此前混在 tests/ 里, 被 cce-submit 的合同 job(生产入口的闸)逐次跑 ⇒ 在 2 核 runner 上
#   单个测试超 900 s, 四个 profile 的 canary 全在合同 job 挂掉, 一次模型调用都没发出去。
#   生产闸只守生产; 这一层由 CCE_JEV_HEAVY=1 开启, 在这里手动跑(公开仓, 分钟不计费)。
#   不带任何模型或 API secret, 不拉模型。
on:
  workflow_dispatch:

permissions:
  contents: read

# ★ 两轮的「已提交结果现算」闸都不在这里, 只在产出平台(本机 macOS)跑:
#   第二轮本机 9 进程约 2 h, 标准 runner 估计超时限(结果落 results/jev_distill2_recompute_<日期>.json);
#   第一轮在 Linux runner 上不可复现 —— 弱正则(λ=1e-4)近可分拟合的端点随 BLAS 变, 头权重差到 0.5、描述量差到 1e-3
#   (2026-09-28 两次 cce-jev-heavy 运行)。★ 判决层跨平台一致已核(2026-09-29): 下面 platforms 目标在 Linux 上
#   7 个文件非浮点字段 0 处不同 —— 判决、标签、计数、距离全同, 只有拟合参数漂移。
jobs:
  heavy:
    if: github.repository == 'luogangan7-lgtm/cce-engine-oss'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - "tests/test_cce_jev_distill_head.py -k 'not recompute and not platforms'"
          - "tests/test_cce_jev_distill_head.py -k platforms -s"   # 第一轮判决层跨平台是否一致: 非浮点逐字, 浮点只报漂移
          - "tests/test_cce_jev_distill2_head.py -k end_to_end"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CCE_JEV_HEAVY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 重算闸在 HEAD 的 git worktree 里跑
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Heavy tier (must run, none skipped)
        run: python -m pytest -q -p no:cacheprovider -rs ${{ matrix.target }}
