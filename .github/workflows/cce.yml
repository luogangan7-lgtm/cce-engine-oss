name: CCE

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "reply | post"
        required: true
        default: post
        type: choice
        options: [post, reply]
      text:
        description: "待评内容逐字原文"
        required: true
        type: string
      context:
        description: "语境(板块/平台/上下文)"
        required: true
        type: string
      audience:
        description: "post模式必填: 受众原话语料(≥3条/≥80词)。留空则用仓库内 corpus 默认语料"
        required: false
        type: string
      context_decl:
        description: "情境声明 JSON(生产时应显式声明已知面, 如 {\"关系位置\":\"首次接触\",\"信息环境\":\"推荐流\"})"
        required: false
        default: ""
      ref_post:
        description: "post模式: 上一篇正文(s8成对下注用)。不是标识, 是完整正文"
        required: false
        default: ""
      ref_tag:
        description: "本次运行标识"
        required: true
        type: string
  repository_dispatch:
    types: [cce-run, cce-batch]

concurrency:
  group: cce-${{ github.event.client_payload.ref_tag || inputs.ref_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  single:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'cce-run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 配置↔代码一致性自检(前置闸)
        run: python3 scripts/consistency_check.py
      - name: 投料(含契约校验)
        env:
          MODE: ${{ github.event.client_payload.mode || inputs.mode }}
          TEXT: ${{ github.event.client_payload.text || inputs.text }}
          CONTEXT: ${{ github.event.client_payload.context || inputs.context }}
          AUDIENCE: ${{ github.event.client_payload.audience || inputs.audience }}
          REF_TAG: ${{ github.event.client_payload.ref_tag || inputs.ref_tag }}
          CONTEXT_DECL: ${{ github.event.client_payload.context_decl || inputs.context_decl }}
          REF_POST: ${{ github.event.client_payload.ref_post || inputs.ref_post }}
        run: python .github/prepare.py
      # ★ 2026-09-02 摘除: 本工作流不再调用 cce_full_run.py。
      #
      # 为什么摘: 它是**第二条通往 manifest.complete=true 的路**。
      #   · §2.1 明写「兼容工作流或历史工作流不应继续承担新生产功能」
      #   · 铁律 22「Legacy 组件不得成为新生产依赖」
      #   · workflow registry 已登记 production_entrypoint = cce-submit.yml (唯一)
      # 文档核对时这处分歧被 §37 与 §2.1 **两个章节独立查出**, owner 裁定摘除。
      #
      # 影响面 = 零: 本工作流的两个 mode 早已在 prepare.py 前置就被拒 ——
      #   prepare.py:37 只收 reply|response|outbound_post ⇒ 本文件的 post 被拒
      #   prepare.py:62 出站模式必填 guard_profile ⇒ 本文件无该输入, reply 被拒
      #   (2026-08-13 实测连挂两次: runs 31691417474 / 31691414219)
      # 所以被摘的这一步**本来就不可达**。保留工作流本身是为了让旧调用方
      # 拿到一句明确的话, 而不是「workflow not found」。
      - name: 已退役 —— 请改用 cce-submit.yml
        run: |
          echo "::error::cce.yml 已退役, 不再执行 CCE 测量。"
          echo "所有出站与响应测量走 .github/workflows/cce-submit.yml 投 cce.submission.v1 envelope。"
          echo "本地先验: python3 scripts/cce_submission.py <envelope>.json --outdir /tmp/pkg"
          exit 1
      - name: 执行清单摘要
        if: always()
        run: python .github/summarize.py >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cce-${{ github.event.client_payload.ref_tag || inputs.ref_tag }}
          path: run/out/
          retention-days: 90

  prep:
    if: github.event.action == 'cce-batch'
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.gen.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          ITEMS: ${{ toJSON(github.event.client_payload.items) }}
        run: |
          python - <<'PY'
          import json, os
          items = json.loads(os.environ["ITEMS"])
          os.makedirs("batch", exist_ok=True)
          json.dump(items, open("batch/items.json", "w", encoding="utf-8"), ensure_ascii=False)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("indices=" + json.dumps(list(range(len(items)))) + "\n")
          print(f"批次 {len(items)} 条")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-items
          path: batch/items.json

  batch:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        i: ${{ fromJSON(needs.prep.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 配置↔代码一致性自检(前置闸)
        run: python3 scripts/consistency_check.py
      - uses: actions/download-artifact@v4
        with:
          name: batch-items
          path: batch
      - name: 投料(第 ${{ matrix.i }} 条)
        env:
          ITEMS_FILE: batch/items.json
          ITEM_INDEX: ${{ matrix.i }}
        run: python .github/prepare.py
      # ★ 2026-09-02 摘除, 理由同上(第二条通往 complete 的路)。影响面为零: 本步不可达。
      - name: 已退役 —— 请改用 cce-submit.yml
        run: |
          echo "::error::cce.yml 已退役, 不再执行 CCE 测量。请改用 cce-submit.yml。"
          exit 1
      - name: 执行清单摘要
        if: always()
        run: python .github/summarize.py >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cce-${{ matrix.i }}-${{ github.run_id }}
          path: run/out/
          retention-days: 90
