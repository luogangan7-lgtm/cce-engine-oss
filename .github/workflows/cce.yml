name: CCE

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "reply | post"
        required: true
        default: post
        type: choice
        options: [post, reply]
      text:
        description: "待评内容逐字原文"
        required: true
        type: string
      context:
        description: "语境(板块/平台/上下文)"
        required: true
        type: string
      audience:
        description: "post模式必填: 受众原话语料(≥3条/≥80词)。留空则用仓库内 corpus 默认语料"
        required: false
        type: string
      context_decl:
        description: "情境声明 JSON(生产时应显式声明已知面, 如 {\"关系位置\":\"首次接触\",\"信息环境\":\"推荐流\"})"
        required: false
        default: ""
      ref_post:
        description: "post模式: 上一篇正文(s8成对下注用)。不是标识, 是完整正文"
        required: false
        default: ""
      ref_tag:
        description: "本次运行标识"
        required: true
        type: string
  repository_dispatch:
    types: [cce-run, cce-batch]

concurrency:
  group: cce-${{ github.run_id }}
  cancel-in-progress: false

# ★ 2026-09-02 退役(owner 裁定, 见 config/cce_workflow_registry_v1.json): 摘除 cce_full_run.py 调用(第二条通往 complete 的路)。
# ★ 2026-09-28 连「投料」也摘掉: 退役后它仍把 text/context/audience/items 经 step env 收进来,
#   GitHub 把 step env 原样印进(公开仓的)日志, 再 exit 1 —— 测量不跑, 泄露照跑。
#   现在两类触发都只回一句退役提示, 一个字节的载荷都不碰。inputs 声明保留, 旧调用方才拿得到这句话
#   而不是「Unexpected inputs provided」。
jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 已退役 —— 请改用 cce-submit.yml
        run: |
          echo "::error::cce.yml 已退役, 不再执行 CCE 测量。"
          echo "所有出站与响应测量走 .github/workflows/cce-submit.yml 投 cce.submission.v1 envelope。"
          echo "本地先验: python3 scripts/cce_submission.py <envelope>.json --outdir /tmp/pkg"
          exit 1
