name: context-sensitivity
on: {workflow_dispatch: {}}
jobs:
  cs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: 配置↔代码一致性自检(前置闸)
        run: python3 scripts/consistency_check.py
      - name: 情境敏感度
        env: {MINIMAX_API_KEY: "${{ secrets.MINIMAX_API_KEY }}"}
        run: python3 accuracy/context_sensitivity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ctx-sensitivity, path: accuracy/context_sensitivity.json}
