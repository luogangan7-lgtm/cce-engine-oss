name: CCE Jev Contract

# Pure contract tests for the Decider candidate (experiments/jev). Never downloads a model, never imports torch,
# never touches a model secret. Runs on push / PR touching the candidate; the model workflows are manual and separate.
on:
  push:
    paths:
      - "experiments/jev/**"
      - ".github/workflows/cce-jev-*.yml"
      - ".github/scripts/cce_jev_admit.py"
      - "tests/test_cce_jev_boundary.py"
      - "corpus/**"
      - "tests/data/real_corpus_pilot_prereg.json"
  pull_request:
    paths:
      - "experiments/jev/**"
      - ".github/workflows/cce-jev-*.yml"
      - ".github/scripts/cce_jev_admit.py"
      - "tests/test_cce_jev_boundary.py"
      - "corpus/**"
      - "tests/data/real_corpus_pilot_prereg.json"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test runner only (no model dependencies)
        run: python -m pip install "pytest>=8,<9"
      - name: Pure contract tests (fake backend, fake tokenizer, no network)
        run: |
          python -m pytest experiments/jev/tests tests/test_cce_jev_boundary.py -q -p no:cacheprovider -rs --assert=plain --junitxml=jev-junit.xml
      - name: Tests were discovered and none skipped
        run: python experiments/jev/junit_gate.py jev-junit.xml 40
      - name: Lock and workflow pins are consistent
        run: python experiments/jev/cli.py check-locks
      - name: No model files appeared on the runner
        run: |
          test -z "$(find . -path ./.git -prune -o \( -name '*.safetensors' -o -name '*.gguf' -o -name '*.pt' -o -name '*.bin' \) -print | head -1)"
          python -c "import sys; assert not any(m in sys.modules for m in ('torch','transformers','decider'))"
