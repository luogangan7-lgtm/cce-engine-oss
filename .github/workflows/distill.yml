name: distill-subjects
on:
  workflow_dispatch:
    inputs:
      max_users: {description: "蒸馏前N个最活跃主体(0=全部)", required: false, default: "16", type: string}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: 配置↔代码一致性自检(前置闸)
        run: python3 scripts/consistency_check.py
      - name: 主体蒸馏 L1-L4
        env: {MINIMAX_API_KEY: "${{ secrets.MINIMAX_API_KEY }}"}
        run: python3 scripts/distill_subjects.py --max-users ${{ inputs.max_users }} --l3 --l4
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: distilled, path: subjects/}
