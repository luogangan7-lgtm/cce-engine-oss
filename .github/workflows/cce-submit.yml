name: CCE Submit
run-name: CCE ${{ inputs.submission_id || github.event.client_payload.submission.submission_id || github.run_id }}

on:
  pull_request:
    paths:
      - ".github/workflows/cce-submit.yml"
      - ".github/prepare.py"
      - "config/cce_*"
      - "config/platform_adapter_registry_v1.json"
      - "config/outbound_guard_registry_v1.json"
      - "scripts/cce_*"
      - "tests/test_cce_*"
      - "examples/cce_*"
      - "skills/**"
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Exact submission_id used to identify this run"
        required: true
        type: string
      submission_json:
        description: "Complete cce.submission.v1 schema 1.1.0 JSON envelope"
        required: true
        type: string
      with_alignment:
        description: "Run the reader-to-draft alignment diagnostic (off by default: it is 81% of run time and its own spec forbids using it as a gate)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [cce-submit]

concurrency:
  group: cce-submit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Submission, content, subject-window, cross-plane and response gates
        # 2026-08-18: 原先是硬编码的 11 行清单。新增测试文件若忘了加进去,
        # 它就**永远不跑, 而 CI 照样全绿** —— 假检查, 且失效时无声。
        # 改成遍历 + 数量下限自守: 路径写错/文件被误删会红, 不会静默跑零个。
        run: |
          set -euo pipefail
          n=$(ls tests/test_*.py | wc -l)
          echo "发现 $n 个测试文件"
          test "$n" -ge 53 || { echo "❌ 只发现 $n 个(少于登记数), 路径或文件出了问题"; exit 1; }
          for t in tests/test_*.py; do echo "--- $t"; PYTHONDONTWRITEBYTECODE=1 python3 "$t"; done

      # P1 本体迁移闸。原验收标准「旧名在生产路径 grep 命中==0」写错了且不可达 ——
      # 它把「仍在使用的旧本体 / 冻结证据 / 黑名单哨兵 / 同名异义 / 语料自己的英文单词」
      # 混成一个文本搜索结果。判据改为「旧本体依赖归零 + 遗留出现全部分类」。
      - name: P1 ontology migration gate
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_ontology_migration.py

      # 铁律 20 的可执行形式: 新增 Parser 不得修改 CCE Core (§44.9 P3 验收 gate)
      - name: CCE Core boundary gate
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/cce_core_boundary.py

      # §44.9 P5: 长期学习链不得建在会过期的 GitHub artifact 上
      - name: Archive plane gate
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/cce_archive.py

      # §48 15 段 × §44.9 八个 Phase 的验收 gate 一次跑齐。
      # ★ 显示上区分 ✓(内容已建) 与 ◐(只有 gate/只有判据) —— gate 绿不等于 Phase 做完。
      - name: Chain conformance
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/cce_chain_conformance.py

  prep:
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.package.outputs.profile }}
      indices: ${{ steps.package.outputs.indices }}
      submission_id: ${{ steps.package.outputs.submission_id }}
    steps:
      - uses: actions/checkout@v4
      - id: package
        env:
          SUBMISSION_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_json || toJSON(github.event.client_payload.submission) }}
          EXPECTED_SUBMISSION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_id || github.event.client_payload.submission.submission_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ["SUBMISSION_JSON"]
          data = json.loads(raw)
          if data.get("submission_id") != os.environ["EXPECTED_SUBMISSION_ID"]:
              raise SystemExit("dispatch submission_id does not match submission envelope")
          Path("submission-input.json").write_text(raw, encoding="utf-8")
          PY
          python3 scripts/cce_submission.py submission-input.json --outdir submission-package
          python3 - <<'PY'
          import json, os
          data = json.load(open("submission-package/normalized.json", encoding="utf-8"))
          items = json.load(open("submission-package/items.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"profile={data['profile']}\n")
              out.write(f"submission_id={data['submission_id']}\n")
              out.write("indices=" + json.dumps(list(range(len(items)))) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cce-submission-source
          path: submission-package/
          retention-days: 90

  outbound:
    needs: prep
    if: needs.prep.outputs.profile == 'outbound_post' || needs.prep.outputs.profile == 'outbound_reply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        i: ${{ fromJSON(needs.prep.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 scripts/consistency_check.py
      - uses: actions/download-artifact@v4
        with:
          name: cce-submission-source
          path: submission-package
      - name: Materialize exact item ${{ matrix.i }}
        env:
          ITEMS_FILE: submission-package/items.json
          ITEM_INDEX: ${{ matrix.i }}
        run: python3 .github/prepare.py
      - name: Outbound style gate
        # 2026-08-18: 原 if 只匹配 outbound_reply, 于是 outbound_post 从不过链上文风闸,
        # 帖子的文风数字全部只来自本地手跑, 不是管道强制的。两档都开。
        if: needs.prep.outputs.profile == 'outbound_post' || needs.prep.outputs.profile == 'outbound_reply'
        run: python3 scripts/style_check.py run/input.txt
      - name: Run profile-frozen CCE chain
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          CCE_ALIGN_THETA: ${{ vars.CCE_ALIGN_THETA || '0.35' }}
        run: |
          python3 scripts/cce_full_run.py \
            --mode "$(cat run/mode)" \
            --text-file run/input.txt \
            --context "$(cat run/context)" \
            --outdir run/out \
            --submission-meta run/submission_meta.json \
            $(test -f run/reader.txt && echo "--reader-file run/reader.txt") \
            $(test -f run/guard_profile && echo "--guard-profile $(cat run/guard_profile)") \
            $(test -f run/audience.txt && echo "--audience-file run/audience.txt") \
            $(test -f run/ref.txt && echo "--ref-post run/ref.txt") \
            $(test -f run/context_decl.json && echo "--context-decl run/context_decl.json")
      - name: Reader-to-draft alignment gate
        if: needs.prep.outputs.profile == 'outbound_reply' && inputs.with_alignment
        env:
          CCE_ALIGN_THETA: ${{ vars.CCE_ALIGN_THETA || '0.35' }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python3 scripts/reply_loop.py --reader run/reader.txt --draft run/input.txt \
            --context "$(cat run/context)" --out run/out/reply_alignment.json
          # 2026-08-10 实测: 该对齐算子同稿重跑 3/8 翻转, |Δ对齐分|均值 0.213 与 θ=0.35 同量级,
          # s6_alignment 自身口径为"不作放行/拦截依据"。故只记录诊断, 不作二值门(全占比原则: 禁布尔 gate)。
          jq '.verdict' run/out/reply_alignment.json
      - name: Execution summary
        if: always()
        run: python3 .github/summarize.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cce-item-${{ matrix.i }}-${{ github.run_id }}
          path: run/out/
          retention-days: 90

  subject-measure:
    needs: prep
    if: needs.prep.outputs.profile == 'subject_chain'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        i: ${{ fromJSON(needs.prep.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: cce-submission-source
          path: submission-package
      - name: Materialize observed response ${{ matrix.i }}
        env:
          ITEMS_FILE: submission-package/items.json
          ITEM_INDEX: ${{ matrix.i }}
        run: python3 .github/prepare.py
      - id: cce
        name: Run response measurement chain
        continue-on-error: true
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          CCE_ALIGN_THETA: ${{ vars.CCE_ALIGN_THETA || '0.35' }}
        run: |
          python3 scripts/cce_full_run.py --mode "$(cat run/mode)" --text-file run/input.txt \
            --context "$(cat run/context)" --outdir run/out \
            --submission-meta run/submission_meta.json
      - name: Require exact valid s1 measurement
        run: |
          jq -e '.stages.s1_readout.status == "OK"' run/out/manifest.json >/dev/null
          jq -e --arg expected "$(jq -r .text_sha256 run/submission_meta.json)" \
            '.text_sha256 == $expected' run/out/manifest.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cce-subject-item-${{ matrix.i }}-${{ github.run_id }}
          path: run/out/
          retention-days: 90

  outbound-aggregate:
    needs: [prep, outbound]
    if: always() && needs.prep.result == 'success' && (needs.prep.outputs.profile == 'outbound_post' || needs.prep.outputs.profile == 'outbound_reply')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cce-submission-source
          path: submission-package
      - uses: actions/download-artifact@v4
        with:
          pattern: cce-item-*-${{ github.run_id }}
          path: item-artifacts
      - id: manifest
        name: Build aggregate workflow manifest
        continue-on-error: true
        env:
          WITH_ALIGNMENT: ${{ inputs.with_alignment }}
        run: |
          python3 scripts/cce_workflow_manifest.py --normalized submission-package/normalized.json \
            --artifacts item-artifacts --out submission-result/workflow-manifest.json \
            $(test "$WITH_ALIGNMENT" = "true" && echo --require-alignment)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cce-result-${{ github.run_id }}
          path: submission-result/
          retention-days: 90
      - name: Enforce aggregate gate
        if: steps.manifest.outcome != 'success'
        run: exit 1

  subject-aggregate:
    needs: [prep, subject-measure]
    if: always() && needs.prep.result == 'success' && needs.prep.outputs.profile == 'subject_chain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cce-submission-source
          path: submission-package
      - uses: actions/download-artifact@v4
        with:
          pattern: cce-subject-item-*-${{ github.run_id }}
          path: response-artifacts
      - name: Restore normalized chain inputs
        run: |
          jq '.subject_chain' submission-package/normalized.json > submission-package/chain.json
          jq '.response_source' submission-package/normalized.json > submission-package/responses.json
      - id: manifest
        name: Verify all response measurement artifacts
        continue-on-error: true
        run: |
          python3 scripts/cce_workflow_manifest.py --normalized submission-package/normalized.json \
            --artifacts response-artifacts --out submission-result/workflow-manifest.json
      - name: Exact join, activated aggregation and end-to-end audit
        if: steps.manifest.outcome == 'success'
        run: |
          python3 scripts/cce_response_chain.py ingest --responses submission-package/responses.json \
            --chain submission-package/chain.json --artifacts-dir response-artifacts \
            --out submission-result/subject-chain.json --audit-out submission-result/subject-chain-audit.json
          python3 scripts/cce_end_to_end.py --subject-chain submission-result/subject-chain.json \
            --out submission-result/end-to-end-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cce-result-${{ github.run_id }}
          path: submission-result/
          retention-days: 90
      - name: Enforce aggregate gate
        if: steps.manifest.outcome != 'success'
        run: exit 1

# oss
