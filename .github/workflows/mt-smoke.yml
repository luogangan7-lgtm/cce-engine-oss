name: MT smoke (Hy-MT2 vs DeepL)

# 研究工作流, 不是生产闸。它的绿不构成任何「CCE 全链通过」的声明(见 docs/cce_workflow_spec_v1.md §1)。
#
# 它只回答一个问题: 把「中文起草 → 机翻」里的 DeepL 换成本地 Hy-MT2, 值不值、要不要重标定。
# 判据不是「译文好不好」(那要人读), 而是 style_check.py 的 --translated 档还能不能用 ——
# 该档的基准是拿 DeepL 实测标定的(中文逗号停顿被系统性转成 em dash, 321 词出 8 处)。
# 换翻译器 = 换仪器。若 Hy-MT2 的 em dash / 缩写密度与 DeepL 不同量级, 该档必须重标定后才能用。

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "仓库内的中文源文件路径(留空则用内置样本)"
        required: false
        type: string
      quant:
        description: "量化档"
        required: false
        default: Q4_K_M
        type: choice
        options: [Q4_K_M, Q6_K, Q8_0]

env:
  HF_REPO: tencent/Hy-MT2-1.8B-GGUF
  LLAMA_TAG: b10456

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Runner facts
        run: |
          echo "nproc=$(nproc)  mem=$(free -g | awk '/Mem:/{print $2}')GB  disk=$(df -BG --output=avail / | tail -1)"

      # 模型 1.13GB, 每次重下会吃满 45 分钟里的一大块。缓存键带量化档, 换档不会串。
      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model
          key: hymt2-${{ inputs.quant || 'Q4_K_M' }}-v1

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          Q="${{ inputs.quant || 'Q4_K_M' }}"
          mkdir -p model
          curl -fL --retry 3 -o "model/Hy-MT2-1.8B-$Q.gguf" \
            "https://huggingface.co/${HF_REPO}/resolve/main/Hy-MT2-1.8B-$Q.gguf"
          ls -lh model/

      - name: Install llama.cpp
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          mkdir -p llama && tar -xzf llama.tar.gz -C llama --strip-components=1
          # 预编译包把二进制和 .so 一起放在解压根目录, 没有 bin/ 子目录 ——
          # 照模型卡写的 ./build/bin/ 是源码编译的路径, 这里不适用(实测 exit 127)。
          test -x llama/llama-completion || { echo "llama-completion 不在预期位置"; ls llama | head -30; exit 1; }
          echo "$PWD/llama" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/llama" >> "$GITHUB_ENV"
          ./llama/llama-completion --version 2>&1 | head -3 || true

      - name: Translate
        env:
          QUANT: ${{ inputs.quant || 'Q4_K_M' }}
          SRC: ${{ inputs.source_file }}
        run: |
          set -euo pipefail
          if [ -n "$SRC" ] && [ -f "$SRC" ]; then cp "$SRC" src.txt; else cp tests/data/mt_smoke_zh.txt src.txt; fi
          echo "源文 $(wc -m < src.txt) 字"
          # 提示词用模型卡给的 Default Translation 英文档
          {
            printf 'Translate the following text into English. Note that you should only output the translated result without any additional explanation:\n\n'
            cat src.txt
          } > prompt.txt
          # 官方推荐参数(1.8B/7B): temp 0.7 / top-p 0.6 / top-k 20 / repeat-penalty 1.05
          # -ngl 0 = 纯 CPU, runner 无 GPU
          START=$(date +%s)
          llama-completion \
            --model "model/Hy-MT2-1.8B-$QUANT.gguf" \
            -f prompt.txt --jinja -ngl 0 -no-cnv \
            --temp 0.7 --top-p 0.6 --top-k 20 --repeat-penalty 1.05 \
            -n 1024 -t "$(nproc)" 2> llama.err > out.raw
          echo "耗时 $(( $(date +%s) - START ))s"
          python3 scripts/mt_extract.py out.raw prompt.txt > hymt2_en.txt
          echo "--- 译文 ---"; cat hymt2_en.txt

      - name: Compare fingerprints against DeepL baseline
        run: python3 scripts/mt_fingerprint.py hymt2_en.txt --label "Hy-MT2 $QUANT" | tee fingerprint.txt
        env:
          QUANT: ${{ inputs.quant || 'Q4_K_M' }}

      - uses: actions/upload-artifact@v4
        with:
          name: mt-smoke-${{ github.run_id }}
          path: |
            src.txt
            hymt2_en.txt
            fingerprint.txt
            llama.err
          retention-days: 90
