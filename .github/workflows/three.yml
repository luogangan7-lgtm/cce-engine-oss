name: three-tasks
on:
  workflow_dispatch:
    inputs:
      task:
        description: "t1 | t2 | t3 | t2ctl"
        required: true
        default: "t1"
        type: string
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 配置↔代码一致性自检(前置闸)
        run: python3 scripts/consistency_check.py
      - name: 跑任务
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ '${{ inputs.task }}' = 't2ctl' ]; then
            python3 accuracy/t2_control.py
          else
            python3 accuracy/${{ inputs.task }}_*.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-${{ inputs.task }}
          path: accuracy/*.json
