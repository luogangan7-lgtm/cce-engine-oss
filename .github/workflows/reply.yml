name: reply-loop
on:
  workflow_dispatch:
    inputs:
      reader:   {description: "对方原文逐字", required: true, type: string}
      draft:    {description: "我方回复草稿", required: true, type: string}
      context:  {description: "语境", required: true, type: string}
      ref_tag:  {description: "本次标识", required: true, type: string}
# ★ 2026-09-28 退役(见 config/cce_workflow_registry_v1.json)。它把 reader/draft 原文经 `${{ inputs.* }}`
#   直接展开进 run 脚本: 公开日志里印出全文, 还是 shell 注入口(同一步里带着 MINIMAX_API_KEY)。
#   回复测量早已由 cce-submit.yml 的 outbound_reply profile 承担; 本工作流 2026-08-09 起未再被调用。
jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 已退役 —— 请改用 cce-submit.yml (profile=outbound_reply)
        run: |
          echo "::error::reply.yml 已退役。回复测量走 .github/workflows/cce-submit.yml, profile=outbound_reply。"
          exit 1
