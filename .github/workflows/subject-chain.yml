name: CCE Subject Chain

on:
  pull_request:
    paths:
      - ".github/subject_prepare.py"
      - ".github/workflows/subject-chain.yml"
      - "config/cce_*"
      - "scripts/cce_*"
      - "tests/test_cce_*"
      - "examples/cce_*"
  workflow_dispatch:
    inputs:
      chain_json:
        description: "cce.subject_window_chain.v1 JSON"
        required: true
        type: string
      responses_json:
        description: "cce.response_source.v1 JSON with exact observed inbound texts"
        required: true
        type: string
      measurement_case_json:
        description: "Optional validated cce.analysis_case.v1 JSON for cross-plane audit"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [cce-subject-chain]

concurrency:
  group: cce-subject-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Content, subject-window, cross-plane and response gates
        run: |
          python3 tests/test_cce_contract.py
          python3 tests/test_cce_window_chain.py
          python3 tests/test_cce_end_to_end.py
          python3 tests/test_cce_response_chain.py

  prep:
    needs: contract
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'cce-subject-chain'
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.prepare.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        name: Validate evidence and freeze exact response items
        env:
          CHAIN_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_json || toJSON(github.event.client_payload.chain) }}
          RESPONSES_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.responses_json || toJSON(github.event.client_payload.responses) }}
          MEASUREMENT_CASE_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.measurement_case_json || toJSON(github.event.client_payload.measurement_case) }}
        run: python3 .github/subject_prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: subject-source
          path: subject-package/
          retention-days: 90

  measure-responses:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        i: ${{ fromJSON(needs.prep.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: subject-source
          path: subject-package
      - name: Prepare exact inbound response ${{ matrix.i }}
        env:
          ITEMS_FILE: subject-package/items.json
          ITEM_INDEX: ${{ matrix.i }}
        run: python3 .github/prepare.py
      - id: cce
        name: Run CCE reply chain
        continue-on-error: true
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          CCE_ALIGN_THETA: ${{ vars.CCE_ALIGN_THETA || '0.35' }}
        run: |
          python3 scripts/cce_full_run.py \
            --mode "$(cat run/mode)" \
            --text-file run/input.txt \
            --context "$(cat run/context)" \
            --outdir run/out
      - name: Require valid s1 measurement
        run: |
          python3 - <<'PY'
          import json
          manifest = json.load(open("run/out/manifest.json", encoding="utf-8"))
          status = (manifest.get("stages") or {}).get("s1_readout", {}).get("status")
          if status != "OK":
              raise SystemExit(f"s1_readout must be OK, got {status!r}")
          print(f"s1_readout=OK; downstream_complete={manifest.get('complete')}")
          PY
      - name: Execution summary
        if: always()
        run: python3 .github/summarize.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cce-subject-response-${{ matrix.i }}-${{ github.run_id }}
          path: run/out/
          retention-days: 90

  aggregate:
    needs: [prep, measure-responses]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: subject-source
          path: subject-package
      - uses: actions/download-artifact@v4
        with:
          pattern: cce-subject-response-*-${{ github.run_id }}
          path: response-artifacts
      - name: Exact-fingerprint join and activated-window aggregation
        run: |
          python3 scripts/cce_response_chain.py ingest \
            --responses subject-package/responses.json \
            --chain subject-package/chain.json \
            --artifacts-dir response-artifacts \
            --out subject-result/subject-chain.json \
            --audit-out subject-result/subject-chain-audit.json
          measurement_args=()
          if [[ -f subject-package/measurement-case.json ]]; then
            measurement_args+=(--measurement-case subject-package/measurement-case.json)
          fi
          python3 scripts/cce_end_to_end.py \
            --subject-chain subject-result/subject-chain.json \
            "${measurement_args[@]}" \
            --out subject-result/end-to-end-audit.json
      - name: Gate summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          audit = json.load(open("subject-result/end-to-end-audit.json", encoding="utf-8"))
          downstream = audit["downstream_audit"]
          print("## CCE subject-chain gates")
          print(f"- Overall: **{audit['overall_status']}**")
          for name, gate in downstream["gates"].items():
              print(f"- {name}: **{gate['status']}** — {gate['reason']}")
          for name, gate in downstream["attribution_deltas"].items():
              print(f"- {name}: **{gate['status']}** — {gate['reason']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cce-subject-chain-${{ github.run_id }}
          path: subject-result/
          retention-days: 180
