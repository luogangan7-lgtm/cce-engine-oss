name: CCE LLM Candidate Prepare

# Manual, single-permit (schema v2: a models list). Candidate instruct models under experiments/jev/models/<key>/ (backend hf_choice).
# admit (no model code; contents: write only for the consumed-permit ref; HF metadata checked before consumption) → one prepare
# leg per admitted model on its own runner: fetch the pinned files with byte-level anchor checks (stdlib, no HF client), build the
# runtime image from the COMMITTED runtime lock, then an offline synthetic smoke in the container (a CC0 sentence, the 5 production
# questions, 2 forwards each: load report, parameter count, speed, bitwise repeatability). Uploads only the lock proposal and the
# smoke receipt. No Actions cache (two 8–9 GB bundles do not fit the 10 GB repo cache). Nothing here modifies master.
on:
  workflow_dispatch:
    inputs:
      permit_id:
        description: "Single-use prepare permit id (experiments/jev/permits/<id>.json, approved by the owner)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cce-llm-candidate-prepare
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only for the atomic consumed-permit ref
    outputs:
      models: ${{ steps.admit.outputs.models }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Admit permit (atomic single-use ref, no model code)
        id: admit
        env:
          PERMIT_ID: ${{ inputs.permit_id }}
          MODE: prepare
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECEIPT_OUT: admission_receipt.json
        run: python3 .github/scripts/cce_jev_admit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cce-jev-admission-${{ github.run_id }}
          path: admission_receipt.json
          retention-days: 7
          if-no-files-found: error

  prepare:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.admit.outputs.models) }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MODEL_KEY: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cce-jev-admission-${{ github.run_id }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Runner identity, disk and download plan (before any download)
        run: |
          echo "runner=$RUNNER_NAME arch=$RUNNER_ARCH os=$RUNNER_OS env=$RUNNER_ENVIRONMENT run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT model=$MODEL_KEY"
          nproc; free -g; df -h "$RUNNER_TEMP" .
          grep -m1 "model name" /proc/cpuinfo || true
          python3 experiments/jev/cli.py check-locks --model "$MODEL_KEY"
          python3 experiments/jev/cli.py prepare --model "$MODEL_KEY" --receipt admission_receipt.json --dest "$RUNNER_TEMP/bundle" --out prepare-out --plan-only
      - name: Fetch + anchor the pinned files (stdlib streaming; size and LFS sha256 / git blob sha1 checked per file)
        run: |
          python3 experiments/jev/cli.py prepare --model "$MODEL_KEY" --receipt admission_receipt.json --dest "$RUNNER_TEMP/bundle" --out prepare-out
          ls -la "$RUNNER_TEMP/bundle"; du -sh "$RUNNER_TEMP/bundle"; df -h "$RUNNER_TEMP"
      - name: Whitelist check (only the locked file list)
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          key = os.environ['MODEL_KEY']
          assert re.fullmatch(r'[a-z0-9][a-z0-9.-]{2,40}', key) and '..' not in key
          lock = json.load(open(f'experiments/jev/models/{key}/model.source.lock.json'))['files']
          present = sorted(f for f in os.listdir(os.environ['RUNNER_TEMP'] + '/bundle') if not f.startswith('.'))
          extra = sorted(set(present) - set(lock)); missing = sorted(set(lock) - set(present))
          print('present', present); sys.exit(1 if extra or missing else 0)
          EOF
      - name: Build runtime image from the committed recipe (no weights inside)
        run: |
          DECIDER_REF="$(python3 -c "import json;print(json.load(open('experiments/jev/locks/model.source.lock.json'))['source_revision'])")"
          cp experiments/jev/locks/runtime-cpu.lock.txt experiments/jev/runtime/runtime-cpu.lock.txt
          docker build --pull -f experiments/jev/runtime/Dockerfile.cpu --build-arg "DECIDER_REF=$DECIDER_REF" -t cce-jev-cpu:prepare experiments/jev/runtime
          rm -f experiments/jev/runtime/runtime-cpu.lock.txt
          docker image inspect --format '{{.Id}}' cce-jev-cpu:prepare | tee prepare-out/image_id.txt
      - name: Offline synthetic smoke in the model container (CC0 sentence; no corpus)
        id: smoke
        run: |
          set +e
          bash experiments/jev/runtime/run_llm.sh smoke cce-jev-cpu:prepare "$RUNNER_TEMP/bundle" "$PWD/admission_receipt.json" "$RUNNER_TEMP/smoke" "$MODEL_KEY" 2400 "$PWD/prepare-out/model.assets.lock.proposal.json"
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          OOM="$(docker inspect --format '{{.State.OOMKilled}}' cce-jev-llm 2>/dev/null || echo unknown)"
          echo "oom=$OOM" | tee prepare-out/smoke_host_status.txt
          echo "docker_exit=$RC" >> prepare-out/smoke_host_status.txt
          cp "$RUNNER_TEMP/smoke/"*.json prepare-out/ 2>/dev/null || true
          exit 0
      - name: Upload gate (no model assets, no secrets, size cap)
        id: upload_gate
        if: always()
        run: python3 experiments/jev/cli.py check-upload --root prepare-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.upload_gate.outcome == 'success'
        with:
          name: cce-jev-llm-prepare-${{ github.run_id }}-${{ matrix.model }}
          path: prepare-out
          retention-days: 7
          if-no-files-found: error
      - name: Propagate smoke exit code
        if: always()
        env:
          RC: ${{ steps.smoke.outputs.rc }}
        run: test "${RC:-1}" = "0"
